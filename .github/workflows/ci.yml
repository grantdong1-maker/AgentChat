name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run CLI suite (35 checks)
        run: bash tests/e2e.sh
      - name: Run GUI suite (30 checks)
        run: python3 tests/gui_test.py
